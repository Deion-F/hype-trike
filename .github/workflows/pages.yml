# Builds the browser version with pygbag (tools/build_web.sh) and publishes it to
# GitHub Pages, so https://deionf.com/hype-trike/ starts the game directly.
# Deploys from main (also allowed in Settings -> Environments -> github-pages ->
# Deployment branches). Run it by hand from the Actions tab for another branch.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet pygbag pygame-ce
      - name: Build web version
        run: bash tools/build_web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hypetrike/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
